# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
  pull_request:

env:
  JAVA_VERSION: 11.0.3
  SERVER_ID: ossrh
  PYTHON_VERSION: '3.12.2'
  MAVEN_VERSION: 3.8.1
  WINDOWS_VERSION: 'windows-2019'
  MACOS_VERSION: 'macos-13'

  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn



jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ] #, windows-2019, macos-13

    steps:

      - uses: actions/checkout@v2

      - name: Install OS Dependencies
        run: sudo apt update && ./install-dependencies-linux.sh

      - name: Build
        run: ./prepare.sh

      - name: upload test reports ubuntu
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            **/client/remote_fmu.zip
            **/server/server_zmq
          retention-days: 30

